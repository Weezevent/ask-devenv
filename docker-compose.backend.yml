x-defaults:
  environment: &environment
    ACCOUNTS_URL: ${ACCOUNTS_URL:-https://accounts.weezevent.com/realms/accounts-dev}
    ACCOUNTS_CLIENT_IDENTIFIER: ${ACCOUNTS_CLIENT_IDENTIFIER:-ask_backend_local}
    ACCOUNTS_CLIENT_SECRET: ${ACCOUNTS_CLIENT_SECRET}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-eu.amazon.nova-lite-v1:0}
    MEM0_EXTRACTION_MODEL: ${MEM0_EXTRACTION_MODEL:-mistral.mistral-7b-instruct-v0:2}
    QDRANT_HOST: qdrant
    QDRANT_PORT: "6333"
    GIGZ_LOGS_BASE_URL: ${GIGZ_LOGS_BASE_URL}
    GIGZ_LOGS_TOKEN: ${GIGZ_LOGS_TOKEN}
    GIGZ_FOREST_BASE_URL: ${GIGZ_FOREST_BASE_URL}
    GIGZ_FOREST_USER: ${GIGZ_FOREST_USER}
    GIGZ_FOREST_PASSWORD: ${GIGZ_FOREST_PASSWORD}
    SENTRY_DSN: ${SENTRY_DSN}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:7095,http://localhost:3000}

services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ask-base:
    &ask-base
    build:
      context: ./projects/backend/ask-backend
    volumes:
      - ./projects/backend/ask-backend/ask:/code/ask:ro
    environment:
      <<: *environment
    depends_on:
      - qdrant

  ask:
    <<: *ask-base
    ports:
      - "8000:8000"
    command:
      - --reload

  ask-debug:
    <<: *ask-base
    entrypoint: ""
    command:
      - ipython

  ask-pytest:
    &ask-pytest
    <<: *ask-base
    entrypoint:
      - "pytest"
      - "-p no:cacheprovider"
      - "ask"

  ask-ci-pytest:
    <<: *ask-pytest
    volumes: []

volumes:
  qdrant_data:
