worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # WebSocket upgrade support (Vite HMR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name ask.local api.ask.local;
        return 301 https://$host$request_uri;
    }

    # -------------------------------------------------------------------------
    # https://ask.local — ask-frontend
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2  on;
        server_name ask.local;

        ssl_certificate     /etc/nginx/ssl/ask.local.crt;
        ssl_certificate_key /etc/nginx/ssl/ask.local.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Vite HMR WebSocket
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }
    }

    # -------------------------------------------------------------------------
    # https://api.ask.local — ask-backend
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2  on;
        server_name api.ask.local;

        ssl_certificate     /etc/nginx/ssl/api.ask.local.crt;
        ssl_certificate_key /etc/nginx/ssl/api.ask.local.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://ask:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
